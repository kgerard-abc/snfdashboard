name: Monthly CMS update

on:
  schedule:
    - cron: '30 11 * * 1'     # every Monday, about 7:30 AM Eastern. It does nothing unless CMS has a new month.
  workflow_dispatch:
    inputs:
      test_only:
        description: 'Test run: build everything but do NOT publish (download the result from the run page)'
        type: boolean
        default: true
      force:
        description: 'Reload the current CMS month even if it was already loaded'
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt

      - name: Pull harm summaries typed in the Google Sheet
        run: python3 pipeline/merge_sheet.py "https://docs.google.com/spreadsheets/d/1VQzxLK3Osq9yv3Clt-uQYlLFZoXoj5Grl_WZj2Wo1dc/export?format=xlsx" pipeline/harm_summaries.xlsx

      - name: Pull facility details typed in the Google Sheet
        run: python3 pipeline/merge_extras.py "https://docs.google.com/spreadsheets/d/1PXFDq_55whZPcW0ODuJYsD3NGcJnsvgzYkgV0y8maGQ/export?format=xlsx" pipeline/facility_extras.xlsx

      - name: Download the newest CMS month
        id: fetch
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then F="--force"; else F=""; fi
          set -o pipefail
          if python3 pipeline/fetch_cms.py $F 2>&1 | tee fetch.log; then ok=1; else ok=0; fi
          while IFS= read -r line; do echo "::notice::CMS: $line"; done < fetch.log
          if [ "$ok" = "0" ]; then echo "::error::The CMS download step failed (see the notices above)."; exit 1; fi
          if grep -q "NOTHING NEW" fetch.log; then echo "new=no" >> "$GITHUB_OUTPUT"; else echo "new=yes" >> "$GITHUB_OUTPUT"; fi

      - name: Rebuild the dashboard data
        if: steps.fetch.outputs.new == 'yes' || github.event_name == 'workflow_dispatch'
        run: |
          cd pipeline
          cp ../data.js ../data.previous.js
          python3 scripts/update.py
          cp out/dashboard/data.js ../data.js

      - name: Safety checks before anything is published
        if: steps.fetch.outputs.new == 'yes' || github.event_name == 'workflow_dispatch'
        run: |
          python3 - <<'PY'
          import json, sys
          def load(p):
              t = open(p).read(); return json.loads(t[t.index('=')+1:].rstrip().rstrip(';'))
          old, new = load('data.previous.js'), load('data.js')
          problems = []
          if new['meta']['latest'] < old['meta']['latest']:
              problems.append(f"latest month went backwards: {old['meta']['latest']} to {new['meta']['latest']}")
          if abs(len(new['facilities']) - len(old['facilities'])) > 5:
              problems.append(f"facility count jumped from {len(old['facilities'])} to {len(new['facilities'])}")
          if len(new['harm_summaries']) < len(old['harm_summaries']):
              problems.append(f"harm summaries dropped from {len(old['harm_summaries'])} to {len(new['harm_summaries'])}")
          if problems:
              print("STOPPED:", *problems, sep="\n  "); sys.exit(1)
          print("Safety checks passed. Latest month:", new['meta']['latest_label'])
          PY
          python3 .github/scripts/check_site.py

      - name: Save the test build for download
        if: github.event_name == 'workflow_dispatch' && inputs.test_only
        uses: actions/upload-artifact@v4
        with:
          name: test-build
          path: |
            data.js
            pipeline/out/RI_Nursing_Homes_Database.xlsx
            pipeline/harm_summaries.xlsx

      - name: Publish (commit the new data)
        if: steps.fetch.outputs.new == 'yes' && !(github.event_name == 'workflow_dispatch' && inputs.test_only)
        run: |
          rm -f data.previous.js
          rm -rf pipeline/new_cms_zips pipeline/out
          git config user.name "abc-ri-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A data.js pipeline/store pipeline/harm_summaries.xlsx pipeline/facility_extras.xlsx
          if git diff --cached --quiet; then echo "No changes."; exit 0; fi
          git commit -m "Monthly CMS update"
          git push

      - name: Open an issue listing harm citations that still need a summary
        if: steps.fetch.outputs.new == 'yes' && !(github.event_name == 'workflow_dispatch' && inputs.test_only)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY' > issue.md
          import pandas as pd
          x = pd.read_excel('pipeline/harm_summaries.xlsx', dtype=str).fillna('')
          todo = x[x.what_happened.str.strip() == '']
          print(f"{len(todo)} harm citations on Care Compare have no plain-language summary yet.\n")
          print("Add a row for each new one to the harm_summaries Google Sheet (same columns), then write what_happened. The next update picks it up.\n")
          print("| facility | inspection date | tag | severity | report |\n|---|---|---|---|---|")
          for _, r in todo.head(60).iterrows():
              print(f"| {r.facility} | {r.inspection_date} | {r.tag} | {r.severity} | [report]({r.report_link}) |")
          PY
          gh issue create --title "Monthly CMS update done: harm citations needing summaries" --body-file issue.md
