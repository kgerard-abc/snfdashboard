name: Study - daily staffing download (one-off, does not touch the site)

on:
  push:
    branches: [inspection-staffing-study]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r pipeline/requirements.txt
      - name: Download every quarter of Rhode Island daily staffing data from CMS
        run: python3 pipeline/study/download_daily_pbj.py pbj_daily_ri.csv.gz
      - name: Run the inspection-timing analysis
        run: python3 pipeline/study/insp_study.py pbj_daily_ri.csv.gz pipeline/store/survey_dates.csv
      - name: Save the downloaded file on this study branch only
        run: |
          mkdir -p pipeline/study/data && mv pbj_daily_ri.csv.gz pipeline/study/data/
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pipeline/study/data/pbj_daily_ri.csv.gz
          git commit -m "Study data: RI daily staffing, all CMS quarters [skip ci]" || echo "no change"
          git push
