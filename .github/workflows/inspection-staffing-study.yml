name: Study - daily staffing download (one-off, does not touch the site)

on:
  push:
    branches: [inspection-staffing-study]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r pipeline/requirements.txt
      - name: Download every quarter of Rhode Island daily staffing data from CMS
        run: python3 pipeline/study/download_daily_pbj.py pbj_daily_ri.csv.gz
      - uses: actions/upload-artifact@v4
        with:
          name: pbj-daily-ri
          path: pbj_daily_ri.csv.gz
          retention-days: 14
