name: Probe report access (temporary)
on:
  push:
    branches: [probe-report-access]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Look at ProPublica's inspection text
        run: |
          BR="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36"
          curl -sS -L -A "$BR" -o pp.html "https://projects.propublica.org/nursing-homes/homes/h-415067"
          python3 - <<'PY'
          import re,html,subprocess
          t=open('pp.html',encoding='utf-8',errors='replace').read()
          hrefs=sorted(set(re.findall(r'href="([^"]+)"',t)))
          print('::notice::hrefs:',' '.join(h for h in hrefs if 'h-415067' in h or 'deficien' in h.lower() or 'inspect' in h.lower())[:900])
          txt=re.sub(r'\s+',' ',html.unescape(re.sub(r'<[^>]+>',' ',t)))
          for kw in ['Data last','updated','Inspection Date','inspection on','Based on','resident']:
              j=txt.find(kw); print(f'::notice::[{kw}]', txt[max(0,j-150):j+350] if j>=0 else 'none')
          PY
