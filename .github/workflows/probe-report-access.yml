name: Probe report access (temporary)
on:
  push:
    branches: [probe-report-access]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Look at ProPublica's inspection text
        run: |
          BR="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36"
          curl -sS -L -A "$BR" -o pp.html "https://projects.propublica.org/nursing-homes/homes/h-415067"
          python3 - <<'PY'
          import re,html,subprocess
          t=open('pp.html',encoding='utf-8',errors='replace').read()
          m=re.search(r'(?i)(data (?:last )?updated|updated)[^<]{0,80}',t); print('::notice::updated line:',m.group(0) if m else None)
          links=sorted(set(re.findall(r'href="(/nursing-homes/[^"]*(?:deficien|inspection|survey)[^"]*)"',t)))
          print('::notice::links:',len(links),' '.join(links[:6]))
          dates=sorted(set(re.findall(r'(?:January|February|March|April|May|June|July|August|September|October|November|December)\s+\d{1,2},\s+20\d\d',t)),reverse=True)[:8]
          print('::notice::dates on page:',dates)
          i=t.find('658'); print('::notice::around 658:',html.unescape(re.sub(r'<[^>]+>',' ',t[max(0,i-300):i+900]))[:900].replace('\n',' '))
          if links:
              u='https://projects.propublica.org'+links[0]
              s=subprocess.run(['curl','-sS','-L','-A','Mozilla/5.0','-o','d.html',u]); d=open('d.html',encoding='utf-8',errors='replace').read()
              txt=re.sub(r'\s+',' ',html.unescape(re.sub(r'<[^>]+>',' ',d)))
              j=txt.find('Based on'); print('::notice::deficiency page',u,len(d),'text:',txt[j:j+700] if j>=0 else txt[:500])
          PY
