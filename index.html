<title>Rhode Island Nursing Homes</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,600&display=swap">
<style>
/* Layout: a records-office lookup tool. Header with search, then either the statewide view
   (summary, trends, sortable list of homes) or one home's record (ratings, trends, inspections, fines, owners). */
:root{
  --bg:#ffffff; --panel:#f4f6f9; --ink:#131b27; --ink-2:#465264; --muted:#6b7686; --line:#dfe4ea; --line-2:#c9d1db;
  --accent:#1c4c8c; --accent-wash:#e8eff8;
  --s1:#2a78d6; --s2:#eb6834; --ref:#8b95a3;
  --bad:#b8322b; --bad-wash:#fbeceb; --warn:#9a5d00; --warn-wash:#fdf3e1; --good:#1e7438; --good-wash:#e6f4ea;
  --f-ui:"Public Sans",Helvetica,Arial,sans-serif; --f-head:"Source Serif 4",Georgia,serif;
  --r:6px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f141b; --panel:#171e28; --ink:#e7ecf2; --ink-2:#b3bdca; --muted:#8a95a4; --line:#283240; --line-2:#36414f;
  --accent:#8fb7ee; --accent-wash:#1a2a40;
  --s1:#3987e5; --s2:#d95926; --ref:#7c8796;
  --bad:#f07a71; --bad-wash:#3a1d1c; --warn:#e7a948; --warn-wash:#33260f; --good:#5cc77d; --good-wash:#15301e;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f141b; --panel:#171e28; --ink:#e7ecf2; --ink-2:#b3bdca; --muted:#8a95a4; --line:#283240; --line-2:#36414f;
  --accent:#8fb7ee; --accent-wash:#1a2a40;
  --s1:#3987e5; --s2:#d95926; --ref:#7c8796;
  --bad:#f07a71; --bad-wash:#3a1d1c; --warn:#e7a948; --warn-wash:#33260f; --good:#5cc77d; --good-wash:#15301e;
  color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
a{color:var(--accent)}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{text-wrap:balance;margin:0}
h1{font-family:var(--f-head);font-weight:600;font-size:clamp(26px,4vw,36px);line-height:1.15}
h2{font-size:19px;font-weight:700;margin-bottom:4px}
h3{font-size:15px;font-weight:700}
.lede{color:var(--ink-2);max-width:68ch;margin:6px 0 0}
.small{font-size:13px;color:var(--muted)}
.eyebrow{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* header */
header.top{border-bottom:1px solid var(--line);background:var(--bg)}
header.top .wrap{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;padding-block:14px;padding-bottom:14px}
.brand{display:flex;flex-direction:column;gap:0;cursor:pointer;text-decoration:none;color:inherit}
.brand b{font-family:var(--f-head);font-size:20px;font-weight:600}
.brand span{font-size:12px;color:var(--muted)}
.search{flex:1 1 280px;position:relative;min-width:0}
.search input{width:100%;box-sizing:border-box;padding:9px 12px;border:1px solid var(--line-2);border-radius:var(--r);background:var(--bg)}
.sugg{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--bg);border:1px solid var(--line-2);border-radius:var(--r);z-index:20;box-shadow:0 6px 24px rgba(0,0,0,.12);max-height:360px;overflow:auto}
.sugg button{display:block;width:100%;text-align:left;padding:8px 12px;border:0;background:none;cursor:pointer}
.sugg button:hover,.sugg button.on{background:var(--accent-wash)}
.sugg small{color:var(--muted);display:block}
nav.tabs{display:flex;gap:4px}
nav.tabs a{padding:6px 10px;border-radius:var(--r);text-decoration:none;color:var(--ink-2);font-weight:600;font-size:14px}
nav.tabs a.on{background:var(--accent-wash);color:var(--accent)}

section{margin-top:32px}
.sec-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:8px;margin-bottom:12px}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.card{border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;min-width:0;background:var(--bg)}
.tile .label{font-size:13px;color:var(--ink-2)}
.tile .val{font-size:28px;font-weight:700;line-height:1.2;margin-top:2px}
.tile .sub{font-size:13px;color:var(--muted);margin-top:2px}

/* stars as pips */
.pips{display:inline-flex;gap:2px;vertical-align:middle}
.pips i{width:9px;height:9px;border-radius:2px;background:var(--line-2);display:block}
.pips i.f{background:var(--ink)}
.pips.lg i{width:14px;height:14px;border-radius:3px}
.rating{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}

.chip{display:inline-block;font-size:12px;font-weight:600;padding:1px 7px;border-radius:999px;border:1px solid currentColor;white-space:nowrap;line-height:1.5}
.chip.bad{color:var(--bad);background:var(--bad-wash);border-color:transparent}
.chip.warn{color:var(--warn);background:var(--warn-wash);border-color:transparent}
.chip.good{color:var(--good);background:var(--good-wash);border-color:transparent}
.chip.plain{color:var(--ink-2);background:var(--panel);border-color:transparent}
.delta{font-size:13px;font-weight:600}
.delta.up{color:var(--good)} .delta.down{color:var(--bad)} .delta.same{color:var(--muted)}

/* table */
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.filters select,.filters input[type=text]{padding:6px 8px;border:1px solid var(--line-2);border-radius:var(--r);background:var(--bg);max-width:100%}
.filters label{font-size:13px;color:var(--ink-2);display:flex;gap:6px;align-items:center}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:7px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;font-weight:600;color:var(--ink-2);background:var(--panel);position:sticky;top:0;white-space:nowrap}
th.sort{cursor:pointer;user-select:none}
th.sort:hover{color:var(--ink)}
th .arr{color:var(--accent)}
td.r,th.r{text-align:right}
tbody tr:hover{background:var(--panel)}
tr.click{cursor:pointer}
td .nm{font-weight:600;color:var(--ink)}
td.desc{min-width:260px}
td.home{min-width:150px}
td .sub{font-size:12px;color:var(--muted)}
tr:last-child td{border-bottom:0}

/* charts */
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .axis text{fill:var(--muted);font-size:11px;font-family:var(--f-ui)}
.chart .grid line{stroke:var(--line);stroke-width:1}
.chart .base{stroke:var(--line-2);stroke-width:1}
.tip{position:absolute;pointer-events:none;background:var(--bg);border:1px solid var(--line-2);border-radius:var(--r);padding:7px 9px;font-size:12px;box-shadow:0 4px 16px rgba(0,0,0,.14);z-index:5;min-width:120px;white-space:nowrap}
.tip .t{color:var(--muted);margin-bottom:3px}
.tip .row{display:flex;align-items:center;gap:6px}
.tip .row b{font-variant-numeric:tabular-nums}
.tip .key{width:12px;height:2px;border-radius:1px;display:inline-block}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--ink-2);margin:4px 0 6px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend .ln{width:14px;height:2px;border-radius:1px}
.legend .bx{width:10px;height:10px;border-radius:2px}
.legend .mk{width:1px;height:12px;background:var(--ink-2)}
.chart-title{font-weight:600;font-size:14px}
.note{font-size:12px;color:var(--muted);margin-top:6px}

/* facility page */
.back{display:inline-block;margin-top:18px;font-size:14px;text-decoration:none}
.fac-head{margin-top:10px;display:flex;flex-wrap:wrap;gap:12px 32px;justify-content:space-between}
.fac-head .meta{color:var(--ink-2);font-size:14px;margin-top:6px}
.fac-head .flags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
dl.kv{display:grid;grid-template-columns:minmax(120px,max-content) 1fr;gap:4px 14px;margin:0;font-size:14px}
dl.kv dt{color:var(--muted)}
dl.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.survey{border-top:1px solid var(--line);padding:12px 0}
.survey:first-child{border-top:0;padding-top:0}
.survey-h{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline}
.survey ul{list-style:none;padding:0;margin:8px 0 0;display:grid;gap:6px}
.survey li{display:grid;grid-template-columns:54px 1fr;gap:10px;font-size:14px}
.sev{font-weight:700;text-align:center;border-radius:4px;padding:1px 0;font-size:13px;height:fit-content}
.sev.s1{background:var(--panel);color:var(--ink-2)}
.sev.s2{background:var(--warn-wash);color:var(--warn)}
.sev.s3,.sev.s4{background:var(--bad-wash);color:var(--bad)}
.sev.s4{outline:1.5px solid var(--bad);outline-offset:-1.5px}
.timeline{display:grid;gap:8px}
.tl-row{display:grid;grid-template-columns:150px 1fr;gap:12px;font-size:14px}
.seg{display:flex;flex-direction:column}
.morebtn{margin-top:10px;background:none;border:1px solid var(--line-2);border-radius:var(--r);padding:6px 12px;cursor:pointer}
.morebtn:hover{background:var(--panel)}
.seg-ctl{display:inline-flex;border:1px solid var(--line-2);border-radius:var(--r);overflow:hidden}
.seg-ctl button{border:0;background:none;padding:5px 10px;cursor:pointer;font-size:13px}
.seg-ctl button.on{background:var(--accent-wash);color:var(--accent);font-weight:600}
.sev-key{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--ink-2);margin:6px 0 12px}
.sev-key span{display:inline-flex;gap:6px;align-items:center}
.sev-key .sev{width:30px}
footer{margin-top:48px;border-top:1px solid var(--line);padding-top:16px;font-size:13px;color:var(--muted)}
footer p{max-width:90ch}
@media (max-width:560px){
  .tl-row{grid-template-columns:1fr;gap:2px}
  .tile .val{font-size:24px}
  .survey li{grid-template-columns:44px 1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

  <div class="wrap">

<main class="wrap" id="app"></main>

<script src="data.js"></script>
<script>
(function(){
"use strict";
const D = window.RINH_DATA;
const M = D.months;                       // 'YYYY-MM'
const LATEST = D.meta.latest;
const LI = M.indexOf(LATEST);
const FAC = D.facilities;
const byCCN = {}; FAC.forEach(f => { if (f.ccn) byCCN[f.ccn] = f; });
const MET = {}; D.metrics.forEach(m => MET[m.key] = m);
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

// ---------- helpers
function h(tag, attrs, ...kids){
  const el = document.createElement(tag);
  if (attrs) for (const k in attrs){
    const v = attrs[k];
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k === "text") el.textContent = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat(Infinity)){ if (c == null || c === false) continue; el.append(c.nodeType ? c : document.createTextNode(String(c))); }
  return el;
}
const svgNS = "http://www.w3.org/2000/svg";
function s(tag, attrs){ const el = document.createElementNS(svgNS, tag); for (const k in attrs) el.setAttribute(k, attrs[k]); return el; }
const num = v => (v === null || v === undefined || v === "" || isNaN(+v)) ? null : +v;
const mlabel = m => m ? MON[+m.slice(5,7)-1] + " " + m.slice(0,4) : "";
const dlabel = d => { if (!d) return ""; const [y,mo,da] = d.split("-"); return MON[+mo-1] + " " + (+da) + ", " + y; };
const fmt = (v, dp=2) => v == null ? "–" : (+v).toLocaleString("en-US", {minimumFractionDigits:dp, maximumFractionDigits:dp});
const money = v => v == null ? "–" : "$" + Math.round(v).toLocaleString("en-US");
const mi = m => +m.slice(0,4)*12 + (+m.slice(5,7)-1);
const phone = p => { p = String(p||"").replace(/\D/g,""); return p.length===10 ? `(${p.slice(0,3)}) ${p.slice(3,6)}-${p.slice(6)}` : p; };
const ser = (ccn, key) => (D.series[ccn] && D.series[ccn][key]) || [];
const at = (ccn, key, i) => { const a = ser(ccn,key); return i>=0 && i<a.length ? a[i] : null; };
function lastVal(arr){ for (let i=arr.length-1;i>=0;i--) if (arr[i]!=null) return [arr[i], i]; return [null,-1]; }
function idxMonthsAgo(n){ const t = mi(LATEST)-n; let best=-1; M.forEach((m,i)=>{ if (mi(m)<=t) best=i; }); return best; }
const I12 = idxMonthsAgo(12), I36 = idxMonthsAgo(36);
function riAvg(key){ const a = D.avg.RI && D.avg.RI[key]; const c = D.avg.RI_calc && D.avg.RI_calc[key];
  if (!a) return c || []; return a.map((v,i)=> v!=null ? v : (c ? c[i] : null)); }
function usAvg(key){ return (D.avg.NATION && D.avg.NATION[key]) || []; }
function pips(r, lg){ const w = h("span",{class:"pips"+(lg?" lg":""), "aria-hidden":"true"}); for (let i=1;i<=5;i++) w.append(h("i",{class: r!=null && i<=r ? "f":""})); return w; }
function ratingEl(r, lg){ return r==null ? h("span",{class:"small",text:"Not rated"}) : h("span",{class:"rating", title: r+" of 5 stars"}, pips(r,lg), h("span",{class:"num", text: r})); }
function sevClass(c){ if (!c) return "s1"; if ("ABC".includes(c)) return "s1"; if ("DEF".includes(c)) return "s2"; if ("GHI".includes(c)) return "s3"; return "s4"; }
const SEVTXT = {s1:"Minimal harm potential", s2:"Potential for more than minimal harm", s3:"Actual harm", s4:"Immediate jeopardy"};
function delta(now, then, better, dp=0, unit=""){
  if (now==null || then==null) return null;
  const d = now - then; if (Math.abs(d) < (dp? 0.005 : 0.5)) return h("span",{class:"delta same",text:"no change"});
  const good = better==="up" ? d>0 : better==="down" ? d<0 : null;
  return h("span",{class:"delta " + (good==null ? "same" : good ? "up" : "down"), text:(d>0?"▲ +":"▼ ") + fmt(d,dp).replace("-","") + unit});
}

// 3-year counts
const CUT3 = (+LATEST.slice(0,4)-3) + LATEST.slice(4) + "-01";
const STATS = {};
FAC.forEach(f => {
  if (!f.ccn) return;
  const c = (D.citations[f.ccn]||[]).filter(r => r[0] >= CUT3 && r[5]==="H" && r[7]);
  const p = (D.penalties[f.ccn]||[]).filter(r => r[0] >= CUT3 && r[5]===1);
  STATS[f.ccn] = {
    cit3: c.length, harm3: c.filter(r => "GHIJKL".includes(r[2])).length, ij3: c.filter(r=>"JKL".includes(r[2])).length,
    compl3: c.filter(r=>r[3]).length, fines3: p.filter(r=>r[1]==="Fine").reduce((a,r)=>a+(r[2]||0),0), nfines3: p.filter(r=>r[1]==="Fine").length
  };
});
// operator-name changes (likely ownership changes)
function operatorChanges(ccn){
  const L = (D.names[ccn]||[]).filter(r=>r[0]==="L").sort((a,b)=>a[2]<b[2]?-1:1);
  return L.slice(1).map(r => ({month:r[2], label:"New operator name: " + r[1]}));
}

// ---------- charts
let tipEl = null;
function lineChart(opts){
  // opts: {series:[{name,color,values,width,dash}], dp, height, yMin, yMax, markers:[{month,label}], fromIdx, unit}
  const box = h("div",{class:"chart"});
  const legend = h("div",{class:"legend"});
  if (opts.series.length > 1 || (opts.markers||[]).length){
    opts.series.forEach(sr => legend.append(h("span",null, h("i",{class:"ln", style:`background:${sr.color}`}), sr.name)));
    if ((opts.markers||[]).length) legend.append(h("span",null, h("i",{class:"mk"}), "New operator name"));
  }
  const wrap = h("div",null, legend, box);
  const draw = () => {
    box.textContent = "";
    const W = Math.max(280, box.clientWidth || 600), H = opts.height || 220;
    const pad = {l:40, r:12, t:10, b:24};
    let i0 = opts.fromIdx != null ? opts.fromIdx : M.length, i1 = 0;
    opts.series.forEach(sr => sr.values.forEach((v,i)=>{ if (v!=null){ if (opts.fromIdx==null) i0 = Math.min(i0,i); i1 = Math.max(i1,i);} }));
    if (i1 <= i0){ box.append(h("div",{class:"small",text:"No data for this measure."})); return; }
    i1 = Math.max(i1, LI);
    const t0 = mi(M[i0]), t1 = mi(M[i1]);
    let lo = Infinity, hi = -Infinity;
    opts.series.forEach(sr => sr.values.forEach((v,i)=>{ if (v!=null && i>=i0){ lo=Math.min(lo,v); hi=Math.max(hi,v);} }));
    if (opts.yMin!=null) lo = opts.yMin; else lo = Math.min(0, lo);
    if (opts.yMax!=null) hi = Math.max(opts.yMax, hi);
    // nice ticks
    const span = hi - lo || 1, raw = span/4, mag = Math.pow(10, Math.floor(Math.log10(raw)));
    const step = [1,2,2.5,5,10].map(x=>x*mag).find(x => span/x <= 5) || mag*10;
    if (opts.yMax==null) hi = Math.ceil(hi/step)*step;
    lo = Math.floor(lo/step)*step;
    const X = t => pad.l + (W-pad.l-pad.r) * (t - t0) / Math.max(1, (t1 - t0));
    const Y = v => pad.t + (H-pad.t-pad.b) * (1 - (v - lo)/((hi-lo)||1));
    const svg = s("svg",{viewBox:`0 0 ${W} ${H}`, width:"100%", role:"img", "aria-label": opts.aria || "Line chart"});
    const g = s("g",{class:"grid"}), ax = s("g",{class:"axis"});
    for (let v=lo; v<=hi+1e-9; v+=step){
      g.append(s("line",{x1:pad.l, x2:W-pad.r, y1:Y(v), y2:Y(v)}));
      const t = s("text",{x:pad.l-6, y:Y(v)+3.5, "text-anchor":"end"}); t.textContent = (opts.tickFmt||(x=>+x.toFixed(2)))(v); ax.append(t);
    }
    const y0 = +M[i0].slice(0,4), y1_ = +M[i1].slice(0,4);
    const every = (y1_-y0) > 6 ? 2 : 1;
    for (let y=y0+ (mi(M[i0])%12===0?0:1); y<=y1_; y+=every){
      const x = X(y*12); if (x < pad.l-1 || x > W-pad.r+1) continue;
      g.append(s("line",{x1:x,x2:x,y1:pad.t,y2:H-pad.b}));
      const t = s("text",{x:x, y:H-6, "text-anchor":"middle"}); t.textContent = y; ax.append(t);
    }
    svg.append(g, ax);
    (opts.markers||[]).forEach(mk => { const k = mi(mk.month); if (k<t0||k>t1) return;
      const x = X(k); svg.append(s("line",{x1:x,x2:x,y1:pad.t,y2:H-pad.b,stroke:"var(--ink-2)","stroke-width":1}));
    });
    opts.series.forEach(sr => {
      let d = "", prev = null;
      const singles = [];
      sr.values.forEach((v,i) => {
        if (i < i0 || v == null) return;
        const t = mi(M[i]);
        const gap = prev != null && (t - prev) > 3;
        d += (d === "" || gap ? "M" : "L") + X(t).toFixed(1) + "," + Y(v).toFixed(1);
        prev = t;
      });
      // isolated points (no neighbor within 3 months)
      const pts = sr.values.map((v,i)=> (i>=i0 && v!=null) ? mi(M[i]) : null);
      pts.forEach((t,i) => { if (t==null) return; const near = pts.some((u,j)=> j!==i && u!=null && Math.abs(u-t)<=3); if (!near) singles.push([t, sr.values[i]]); });
      if (d) svg.append(s("path",{d, fill:"none", stroke:sr.color, "stroke-width":sr.width||2, "stroke-linejoin":"round","stroke-linecap":"round"}));
      singles.forEach(([t,v]) => svg.append(s("circle",{cx:X(t), cy:Y(v), r:3.5, fill:sr.color, stroke:"var(--bg)", "stroke-width":2})));
      const [lv, li] = lastVal(sr.values);
      if (lv!=null && li>=i0 && sr.endDot!==false) svg.append(s("circle",{cx:X(mi(M[li])), cy:Y(lv), r:4, fill:sr.color, stroke:"var(--bg)","stroke-width":2}));
    });

      tip.textContent = ""; tip.append(h("div",{class:"t",text:mlabel(M[best])}));

    hit.addEventListener("pointermove", move); hit.addEventListener("pointerleave", leave);
    box.append(svg, tip);
  };
  requestAnimationFrame(draw);
  new ResizeObserver(() => draw()).observe(box);
  return wrap;
}

function barChart(opts){
  // opts: {cats:[], series:[{name,color,values}], stacked:true, height, fmtV}
  const box = h("div",{class:"chart"});
  const legend = h("div",{class:"legend"});
  if (opts.series.length>1) opts.series.forEach(sr => legend.append(h("span",null,h("i",{class:"bx",style:`background:${sr.color}`}), sr.name)));
  const wrap = h("div",null,legend,box);
  const fv = opts.fmtV || (v => Math.round(v).toLocaleString("en-US"));
  const draw = () => {
    box.textContent = "";
    const W = Math.max(260, box.clientWidth||500), H = opts.height||200, pad={l:44,r:8,t:12,b:24};
    const n = opts.cats.length; if (!n){ box.append(h("div",{class:"small",text:"None on record."})); return; }
    const tot = opts.cats.map((_,i)=> opts.series.reduce((a,sr)=>a+(sr.values[i]||0),0));
    let hi = Math.max(1, ...tot);
    const raw = hi/4, mag = Math.pow(10,Math.floor(Math.log10(raw))); const step = [1,2,2.5,5,10].map(x=>x*mag).find(x=>hi/x<=5);
    hi = Math.ceil(hi/step)*step;
    const bw = (W-pad.l-pad.r)/n, barW = Math.min(24, bw*0.6);
    const Y = v => pad.t + (H-pad.t-pad.b)*(1-v/hi);
    const svg = s("svg",{viewBox:`0 0 ${W} ${H}`,width:"100%",role:"img","aria-label":opts.aria||"Bar chart"});
    const g = s("g",{class:"grid"}), ax = s("g",{class:"axis"});
    for (let v=0; v<=hi+1e-9; v+=step){ g.append(s("line",{x1:pad.l,x2:W-pad.r,y1:Y(v),y2:Y(v)}));
      const t=s("text",{x:pad.l-6,y:Y(v)+3.5,"text-anchor":"end"}); t.textContent = (opts.tickFmt||(x=>x>=1000? (x/1000)+"K": x))(v); ax.append(t); }
    svg.append(g, ax);
    const tip = h("div",{class:"tip",hidden:true});
    opts.cats.forEach((c,i) => {
      const cx = pad.l + bw*i + bw/2;
      const t=s("text",{x:cx,y:H-6,"text-anchor":"middle"}); t.textContent = c; ax.append(t);
      let base = 0; const segs = [];
      opts.series.forEach((sr,k) => {
        const v = sr.values[i]||0; if (!v) return;
        const y0 = Y(base), y1 = Y(base+v); base += v;
        const top = k === opts.series.length-1 || opts.series.slice(k+1).every(o=>!(o.values[i]));
        const hgt = Math.max(0, y0-y1 - (base>v?2:0));
        const x = cx-barW/2, y = y1;
        const r = top ? Math.min(4, hgt/2) : 0;
        const p = top
          ? `M${x},${y+hgt}V${y+r}Q${x},${y} ${x+r},${y}H${x+barW-r}Q${x+barW},${y} ${x+barW},${y+r}V${y+hgt}Z`
          : `M${x},${y}H${x+barW}V${y+hgt}H${x}Z`;
        segs.push(s("path",{d:p, fill:sr.color}));
      });
      segs.forEach(p=>svg.append(p));
      const hit = s("rect",{x:pad.l+bw*i, y:pad.t, width:bw, height:H-pad.t-pad.b, fill:"transparent", tabindex:0});
      const show = () => { tip.textContent=""; tip.append(h("div",{class:"t",text:String(c)}));
        opts.series.forEach(sr => tip.append(h("div",{class:"row"},h("i",{class:"key",style:`background:${sr.color}`}),h("b",{text:fv(sr.values[i]||0)}),h("span",{class:"small",text:sr.name}))));
        if (opts.extra) tip.append(h("div",{class:"small",text:opts.extra(i)}));
        tip.hidden=false; const r = svg.getBoundingClientRect(); const px = cx*r.width/W;
        tip.style.left = Math.min(Math.max(0,px+10), box.clientWidth - tip.offsetWidth)+"px"; tip.style.top="4px";
        if (px+10+tip.offsetWidth > box.clientWidth) tip.style.left = Math.max(0, px - tip.offsetWidth - 10)+"px"; };
      hit.addEventListener("pointerenter", show); hit.addEventListener("focus", show);
      hit.addEventListener("pointerleave", ()=>tip.hidden=true); hit.addEventListener("blur", ()=>tip.hidden=true);
      svg.append(hit);
    });
    svg.append(s("line",{class:"base",x1:pad.l,x2:W-pad.r,y1:Y(0),y2:Y(0)}));
    box.append(svg, tip);
  };
  requestAnimationFrame(draw);
  new ResizeObserver(()=>draw()).observe(box);
  return wrap;
}

  ].filter(r => r[1] != null && r[1] !== "" && r[1] !== "0");
  if (ex.length) app.append(h("section",null, h("h2",{text:"More about this home"}), h("p",{class:"small",style:"margin:0 0 10px",text:"Collected by ABC-RI from the sources named."}),
    h("div",{class:"card"}, h("dl",{class:"kv"}, ex.map(r => [h("dt",{text:r[0]}), h("dd",{class:"num",text: (isNaN(+r[1]) ? r[1] : (+r[1]).toLocaleString("en-US",{maximumFractionDigits:1})) + (r[2] && !isNaN(+r[1]) ? r[2] : "")})])))));
}

function footer(){
  app.append(h("footer",null,
    h("p",{text:`Data: CMS Care Compare nursing home files, monthly releases January 2019 to ${D.meta.latest_label}, plus information gathered by Advocates for Better Care in Rhode Island (ABC-RI). Updated ${D.meta.built}.`}),
    h("p",{text:"This site is not affiliated with CMS or the Rhode Island Department of Health. To report an error, contact ABC-RI."})));
}

function route(){
  const hsh = (location.hash||"#home").slice(1);
  app.textContent = "";
  ["home","owners","about"].forEach(t => document.getElementById("tab-"+t).classList.toggle("on", hsh===t || (t==="home" && (hsh===""||hsh==="list"))));
  if (hsh.startsWith("f-")) viewFacility(hsh.slice(2));
  else if (hsh==="owners") viewOwners();
  else if (hsh==="about") viewAbout();
  else viewHome();
  footer();
  if (hsh !== "list") window.scrollTo(0,0);
  const f = hsh.startsWith("f-") && byCCN[hsh.slice(2)];
  document.title = f ? f.name + " · Rhode Island Nursing Homes" : "Rhode Island Nursing Homes";
}
window.addEventListener("hashchange", route);
route();
})();
</script>
