<title>Rhode Island Nursing Homes</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Matches the ABC-RI assisted living inspection site: paper background, Public Sans, ink text,
   thin rule lines, small square corners, sage / amber / orange / brick for severity. */
:root{
  --bg:#F0ECE1; --panel:#E6E1D2; --ink:#1E2A32; --ink-2:#4E5860; --muted:#4E5860; --line:#8F8570; --grid:#D6CFBD; --line-2:#8F8570;
  --accent:#93701F; --accent-wash:#E6E1D2;
  --s1:#1E2A32; --s2:#93701F; --ref:#8F8570; --bar1:#4E5860; --bar2:#7A1F26;
  --sage:#3D6B52; --sage-bg:#DFE6D9; --amber:#6E5A1E; --amber-bg:#E9E1CC;
  --orange:#92471F; --orange-bg:#E7DBCB; --orange-deep:#723313;
  --brick:#7A1F26; --brick-bg:#E8D6D6; --brick-deep:#5E141B;
  --bad:#5E141B; --bad-wash:#E8D6D6; --warn:#723313; --warn-wash:#E7DBCB; --good:#3D6B52; --good-wash:#DFE6D9;
  --f-ui:"Public Sans",system-ui,-apple-system,sans-serif; --f-head:"Public Sans",system-ui,sans-serif;
  --r:3px;
  font-size:17px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#191E1A; --panel:#20251F; --ink:#E8E4D8; --ink-2:#A2A99C; --muted:#A2A99C; --line:#6E6F5A; --grid:#2E342D; --line-2:#6E6F5A;
  --accent:#C9A44C; --accent-wash:#20251F;
  --s1:#E8E4D8; --s2:#C9A44C; --ref:#6E6F5A; --bar1:#A2A99C; --bar2:#D98891;
  --sage:#82AC94; --sage-bg:#223129; --amber:#C7A85E; --amber-bg:#322C1C;
  --orange:#C98757; --orange-bg:#302219; --orange-deep:#E0A87E;
  --brick:#D98891; --brick-bg:#341D1F; --brick-deep:#EBA9AF;
  --bad:#EBA9AF; --bad-wash:#341D1F; --warn:#E0A87E; --warn-wash:#302219; --good:#82AC94; --good-wash:#223129;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#191E1A; --panel:#20251F; --ink:#E8E4D8; --ink-2:#A2A99C; --muted:#A2A99C; --line:#6E6F5A; --grid:#2E342D; --line-2:#6E6F5A;
  --accent:#C9A44C; --accent-wash:#20251F;
  --s1:#E8E4D8; --s2:#C9A44C; --ref:#6E6F5A; --bar1:#A2A99C; --bar2:#D98891;
  --sage:#82AC94; --sage-bg:#223129; --amber:#C7A85E; --amber-bg:#322C1C;
  --orange:#C98757; --orange-bg:#302219; --orange-deep:#E0A87E;
  --brick:#D98891; --brick-bg:#341D1F; --brick-deep:#EBA9AF;
  --bad:#EBA9AF; --bad-wash:#341D1F; --warn:#E0A87E; --warn-wash:#302219; --good:#82AC94; --good-wash:#223129;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));padding-block:0 96px}
@media (max-width:560px){.wrap{padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}}
a{color:inherit;text-decoration:underline}
a:hover{color:var(--ink)}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{text-wrap:balance;margin:0;font-family:var(--f-head)}
h1{font-weight:800;font-size:clamp(28px,5.2vw,40px);line-height:1.12;letter-spacing:-0.015em}
h2{font-size:21px;font-weight:700;margin-bottom:4px;letter-spacing:-0.005em}
h3{font-size:16px;font-weight:600}
.lede{color:var(--ink-2);max-width:640px;margin:14px 0 0;font-size:17px;line-height:1.55}
.updated-line{font-size:13px;color:var(--ink-2);margin:14px 0 0;max-width:640px}
.updated-line strong{color:var(--ink)}
.small{font-size:13px;color:var(--muted)}
.eyebrow{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* masthead */
header.masthead .wrap{padding-block:48px 0}
@media (max-width:560px){header.masthead .wrap{padding-block:32px 0}}
.site-logo-link{display:inline-block;text-decoration:none}
.site-logo{height:76px;width:auto;display:block;margin:0 0 22px;background:#fff}
@media (max-width:560px){.site-logo{height:60px}}
.mast-row{display:flex;flex-wrap:wrap;gap:12px 28px;align-items:flex-end;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:12px}
nav.tabs{display:flex;gap:4px;flex-wrap:wrap}
nav.tabs a{padding:7px 12px;border-radius:var(--r);text-decoration:none;color:var(--ink-2);font-size:14px;font-weight:500}
nav.tabs a:hover{background:var(--panel)}
nav.tabs a.on{background:var(--ink);color:var(--bg)}
.search{flex:1 1 300px;max-width:460px;position:relative;min-width:0}
.search-row{display:flex;align-items:center;gap:10px;border-bottom:2px solid var(--ink);padding-bottom:6px}
.search-row:focus-within{border-bottom-color:var(--accent)}
.search-row svg{flex:none;opacity:.55}
.search input{flex:1;width:100%;min-width:0;border:0;background:transparent;outline:none;font-weight:500;font-size:18px;color:var(--ink);padding:4px 0}
.search input::placeholder{color:var(--ink-2);opacity:.65}
.search input:focus-visible{outline:none}
.sugg{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--bg);border:1px solid var(--line);border-radius:var(--r);z-index:20;box-shadow:0 3px 10px rgba(0,0,0,.18);max-height:360px;overflow:auto}
.sugg button{display:block;width:100%;text-align:left;padding:9px 12px;border:0;background:none;cursor:pointer;border-bottom:1px solid var(--grid)}
.sugg button:last-child{border-bottom:0}
.sugg button:hover,.sugg button.on{background:var(--panel)}
.sugg small{color:var(--muted);display:block}

section{margin-top:40px}
.sec-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:8px;margin-bottom:12px}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.card{border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;min-width:0;background:transparent}
.tile{background:var(--panel)}
.tile .label{font-size:13px;color:var(--ink-2)}
.tile .val{font-size:30px;font-weight:700;line-height:1.2;margin-top:2px;letter-spacing:-0.01em}
.tile .sub{font-size:13px;color:var(--muted);margin-top:2px}

/* stars as pips */
.pips{display:inline-flex;gap:2px;vertical-align:middle}
.pips i{width:9px;height:9px;border-radius:1px;background:var(--grid);display:block}
.pips i.f{background:var(--ink)}
.pips.lg i{width:14px;height:14px;border-radius:2px}
.rating{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}

.chip{display:inline-flex;align-items:center;font-size:12.5px;font-weight:600;padding:2px 8px;border-radius:2px;white-space:nowrap;line-height:1.5;border-left:3px solid transparent}
.chip.bad{color:var(--brick-deep);background:var(--brick-bg);border-left-color:var(--brick)}
.chip.warn{color:var(--orange-deep);background:var(--orange-bg);border-left-color:var(--orange)}
.chip.good{color:var(--sage);background:var(--sage-bg);border-left-color:var(--sage)}
.chip.plain{color:var(--bg);background:var(--ink);border-left-color:var(--accent)}
.delta{font-size:13px;font-weight:600}
.delta.up{color:var(--good)} .delta.down{color:var(--bad)} .delta.same{color:var(--muted)}

/* table */
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
#trend-metric{font-size:14px;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:6px 10px;max-width:100%}
.filters select{font-size:14px;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:6px 10px;max-width:100%}
.filters label{font-size:13.5px;color:var(--ink-2);display:flex;gap:6px;align-items:center;cursor:pointer}
.filters input[type=checkbox]{accent-color:var(--ink)}
.tbl-wrap{overflow-x:auto;border-top:1px solid var(--line)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;font-weight:600;color:var(--ink-2);background:var(--bg);position:sticky;top:0;white-space:nowrap}
th.sort{cursor:pointer;user-select:none}
th.sort:hover{color:var(--ink)}
th .arr{color:var(--accent)}
td.r,th.r{text-align:right}
tbody tr:hover{background:var(--panel)}
tr.click{cursor:pointer}
td .nm{font-weight:500;font-size:15.5px;color:var(--ink)}
td .nm a{text-decoration:none}
td .nm a:hover{text-decoration:underline}
td .sub{font-size:12.5px;color:var(--muted)}
td.desc{min-width:260px}
td.home{min-width:150px}

/* charts */
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .axis text{fill:var(--muted);font-size:11px;font-family:var(--f-ui)}
.chart .grid line{stroke:var(--grid);stroke-width:1}
.chart .base{stroke:var(--line);stroke-width:1}
.tip{position:absolute;pointer-events:none;background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:7px 9px;font-size:12px;box-shadow:0 3px 10px rgba(0,0,0,.18);z-index:5;min-width:120px;white-space:nowrap}
.tip .t{color:var(--muted);margin-bottom:3px}
.tip .row{display:flex;align-items:center;gap:6px}
.tip .row b{font-variant-numeric:tabular-nums}
.tip .key{width:12px;height:2px;border-radius:1px;display:inline-block}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--ink-2);margin:4px 0 6px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend .ln{width:14px;height:2px;border-radius:1px}
.legend .bx{width:10px;height:10px;border-radius:1px}
.legend .mk{width:1px;height:12px;background:var(--ink-2)}
.chart-title{font-weight:600;font-size:14.5px}
.note{font-size:12.5px;color:var(--muted);margin-top:6px;font-style:italic}

/* facility page */
.back{display:inline-block;margin-top:28px;font-size:14px;color:var(--ink-2)}
.fac-head{margin-top:12px;display:flex;flex-wrap:wrap;gap:16px 32px;justify-content:space-between}
.fac-head .meta{color:var(--ink-2);font-size:14px;margin-top:6px}
.fac-head .flags{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.fac-head .card{background:var(--panel)}
dl.kv{display:grid;grid-template-columns:minmax(120px,max-content) 1fr;gap:0 14px;margin:0;font-size:13.5px}
dl.kv dt{color:var(--muted);padding:6px 0;border-bottom:1px solid var(--grid)}
dl.kv dd{margin:0;min-width:0;overflow-wrap:anywhere;padding:6px 0;border-bottom:1px solid var(--grid)}
.survey{border-top:1px solid var(--line);padding:14px 0}
.survey:first-child{border-top:0;padding-top:0}
.survey-h{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline}
.survey-h a{color:var(--ink-2)}
.survey ul{list-style:none;padding:0;margin:10px 0 0;display:grid;gap:8px}
.survey li{display:grid;grid-template-columns:54px 1fr;gap:10px;font-size:14.5px;line-height:1.45}
.sev{font-weight:700;text-align:center;border-radius:2px;padding:1px 0;font-size:13px;height:fit-content;border-left:3px solid transparent}
.sev.s1{background:var(--sage-bg);color:var(--sage);border-left-color:var(--sage)}
.sev.s2{background:var(--amber-bg);color:var(--amber);border-left-color:var(--amber)}
.sev.s3{background:var(--orange-bg);color:var(--orange-deep);border-left-color:var(--orange)}
.sev.s4{background:var(--brick-bg);color:var(--brick-deep);border-left-color:var(--brick)}
.timeline{display:grid;gap:0}
.tl-row{display:grid;grid-template-columns:150px 1fr;gap:12px;font-size:14px;padding:7px 0;border-bottom:1px solid var(--grid)}
.tl-row:last-child{border-bottom:0}
.morebtn{margin-top:10px;background:none;border:0;padding:0;cursor:pointer;color:var(--ink-2);text-decoration:underline;font-size:13.5px}
.morebtn:hover{color:var(--ink)}
.sev-key{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:13px;color:var(--ink-2);margin:8px 0 12px}
.sev-key span{display:inline-flex;gap:8px;align-items:center}
.sev-key .sev{width:34px}
footer{margin-top:60px;border-top:1px solid var(--line);padding-top:20px;font-size:13px;color:var(--muted);line-height:1.6}
footer p{max-width:90ch;margin:0 0 10px}
@media (max-width:560px){
  .tl-row{grid-template-columns:1fr;gap:2px}
  .tile .val{font-size:24px}
  .survey li{grid-template-columns:44px 1fr}
  .search{max-width:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header class="masthead">
  <div class="wrap">
    <a class="site-logo-link" href="#home"><img class="site-logo" src="abcri-logo.png" alt="ABC-RI: Advocates for Better Care in Rhode Island" width="200" height="76"></a>

<script>
(function(){
"use strict";
const D = window.RINH_DATA;
const M = D.months;                       // 'YYYY-MM'
const LATEST = D.meta.latest;
const LI = M.indexOf(LATEST);
const FAC = D.facilities;
const byCCN = {}; FAC.forEach(f => { if (f.ccn) byCCN[f.ccn] = f; });
const MET = {}; D.metrics.forEach(m => MET[m.key] = m);
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

// ---------- helpers
function h(tag, attrs, ...kids){
  const el = document.createElement(tag);
  if (attrs) for (const k in attrs){
    const v = attrs[k];
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k === "text") el.textContent = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat(Infinity)){ if (c == null || c === false) continue; el.append(c.nodeType ? c : document.createTextNode(String(c))); }
  return el;
}
const svgNS = "http://www.w3.org/2000/svg";
function s(tag, attrs){ const el = document.createElementNS(svgNS, tag); for (const k in attrs) el.setAttribute(k, attrs[k]); return el; }
const num = v => (v === null || v === undefined || v === "" || isNaN(+v)) ? null : +v;
const mlabel = m => m ? MON[+m.slice(5,7)-1] + " " + m.slice(0,4) : "";
const dlabel = d => { if (!d) return ""; const [y,mo,da] = d.split("-"); return MON[+mo-1] + " " + (+da) + ", " + y; };
const fmt = (v, dp=2) => v == null ? "–" : (+v).toLocaleString("en-US", {minimumFractionDigits:dp, maximumFractionDigits:dp});
const money = v => v == null ? "–" : "$" + Math.round(v).toLocaleString("en-US");
const mi = m => +m.slice(0,4)*12 + (+m.slice(5,7)-1);
const phone = p => { p = String(p||"").replace(/\D/g,""); return p.length===10 ? `(${p.slice(0,3)}) ${p.slice(3,6)}-${p.slice(6)}` : p; };
const ser = (ccn, key) => (D.series[ccn] && D.series[ccn][key]) || [];
const at = (ccn, key, i) => { const a = ser(ccn,key); return i>=0 && i<a.length ? a[i] : null; };
function lastVal(arr){ for (let i=arr.length-1;i>=0;i--) if (arr[i]!=null) return [arr[i], i]; return [null,-1]; }
function idxMonthsAgo(n){ const t = mi(LATEST)-n; let best=-1; M.forEach((m,i)=>{ if (mi(m)<=t) best=i; }); return best; }
const I12 = idxMonthsAgo(12), I36 = idxMonthsAgo(36);
function riAvg(key){ const a = D.avg.RI && D.avg.RI[key]; const c = D.avg.RI_calc && D.avg.RI_calc[key];
  if (!a) return c || []; return a.map((v,i)=> v!=null ? v : (c ? c[i] : null)); }
function usAvg(key){ return (D.avg.NATION && D.avg.NATION[key]) || []; }
function pips(r, lg){ const w = h("span",{class:"pips"+(lg?" lg":""), "aria-hidden":"true"}); for (let i=1;i<=5;i++) w.append(h("i",{class: r!=null && i<=r ? "f":""})); return w; }
function ratingEl(r, lg){ return r==null ? h("span",{class:"small",text:"Not rated"}) : h("span",{class:"rating", title: r+" of 5 stars"}, pips(r,lg), h("span",{class:"num", text: r})); }
function sevClass(c){ if (!c) return "s1"; if ("ABC".includes(c)) return "s1"; if ("DEF".includes(c)) return "s2"; if ("GHI".includes(c)) return "s3"; return "s4"; }
const SEVTXT = {s1:"Minimal harm potential", s2:"Potential for more than minimal harm", s3:"Actual harm", s4:"Immediate jeopardy"};
function scopeTxt(c){ if (!c) return ""; if ("ADGJ".includes(c)) return "isolated (one or a few residents)"; if ("BEHK".includes(c)) return "a pattern (more than a few residents)"; return "widespread (many residents)"; }
const L = D.links || {};
const pdfUrl = (ccn, kind, d) => (L.pdf||"").replace("{ccn}",ccn).replace("{kind}",kind).replace("{date}",d);
function citationLink(ccn, r){
  // the official report that contains this citation (health citations Care Compare still lists)
  if (r[5]!=="H" || !r[7]) return null;
  const sv = (D.surveys[ccn]||[]).filter(x=>x[0]===r[0] && x[2]).map(x=>x[1]);
  let kind = null;
  if (r[3] && (sv.includes("C") || !sv.includes("S"))) kind = "complaint-inspection";
  else if (sv.includes("S") || !sv.length) kind = "health-inspection";
  else if (sv.includes("C")) kind = "complaint-inspection";
  if (!kind) return null;
  return [" · ", h("a",{href:pdfUrl(ccn,kind,r[0]),target:"_blank",rel:"noopener",text:"See it in the report"})];
}
function reportLinks(ccn, d, rows){
  const sv = (D.surveys[ccn]||[]).filter(x=>x[0]===d && x[2]);
  let std = sv.some(x=>x[1]==="S"), cmp = sv.some(x=>x[1]==="C");
  if (!sv.length && rows){ const listed = rows.filter(r=>r[5]==="H" && r[7]); std = listed.some(r=>!r[3]); cmp = !std && listed.some(r=>r[3]); }
  const out = [];
  if (std) out.push(h("a",{href:pdfUrl(ccn,"health-inspection",d),target:"_blank",rel:"noopener",text:"Read the inspection report"}));
  if (cmp) out.push(h("a",{href:pdfUrl(ccn,"complaint-inspection",d),target:"_blank",rel:"noopener",text: std ? "Complaint report" : "Read the complaint report"}));
  return out;
}
function delta(now, then, better, dp=0, unit=""){
  if (now==null || then==null) return null;
  const d = now - then; if (Math.abs(d) < (dp? 0.005 : 0.5)) return h("span",{class:"delta same",text:"no change"});
  const good = better==="up" ? d>0 : better==="down" ? d<0 : null;
  return h("span",{class:"delta " + (good==null ? "same" : good ? "up" : "down"), text:(d>0?"▲ +":"▼ ") + fmt(d,dp).replace("-","") + unit});
}

// 3-year counts
const CUT3 = (+LATEST.slice(0,4)-3) + LATEST.slice(4) + "-01";
const STATS = {};
FAC.forEach(f => {
  if (!f.ccn) return;
  const c = (D.citations[f.ccn]||[]).filter(r => r[0] >= CUT3 && r[5]==="H" && r[7]);
  const p = (D.penalties[f.ccn]||[]).filter(r => r[0] >= CUT3 && r[5]===1);
  STATS[f.ccn] = {
    cit3: c.length, harm3: c.filter(r => "GHIJKL".includes(r[2])).length, ij3: c.filter(r=>"JKL".includes(r[2])).length,
    compl3: c.filter(r=>r[3]).length, fines3: p.filter(r=>r[1]==="Fine").reduce((a,r)=>a+(r[2]||0),0), nfines3: p.filter(r=>r[1]==="Fine").length
  };
});
// operator-name changes (likely ownership changes)
function operatorChanges(ccn){
  const L = (D.names[ccn]||[]).filter(r=>r[0]==="L").sort((a,b)=>a[2]<b[2]?-1:1);
  return L.slice(1).map(r => ({month:r[2], label:"New operator name: " + r[1]}));
}

// ---------- charts
let tipEl = null;
function lineChart(opts){
  // opts: {series:[{name,color,values,width,dash}], dp, height, yMin, yMax, markers:[{month,label}], fromIdx, unit}
  const box = h("div",{class:"chart"});
  const legend = h("div",{class:"legend"});
  if (opts.series.length > 1 || (opts.markers||[]).length){
    opts.series.forEach(sr => legend.append(h("span",null, h("i",{class:"ln", style:`background:${sr.color}`}), sr.name)));
    if ((opts.markers||[]).length) legend.append(h("span",null, h("i",{class:"mk"}), "New operator name"));
  }
  const wrap = h("div",null, legend, box);
  const draw = () => {
    box.textContent = "";
    const W = Math.max(280, box.clientWidth || 600), H = opts.height || 220;
    const pad = {l:40, r:12, t:10, b:24};
    let i0 = opts.fromIdx != null ? opts.fromIdx : M.length, i1 = 0;
    opts.series.forEach(sr => sr.values.forEach((v,i)=>{ if (v!=null){ if (opts.fromIdx==null) i0 = Math.min(i0,i); i1 = Math.max(i1,i);} }));
    if (i1 <= i0){ box.append(h("div",{class:"small",text:"No data for this measure."})); return; }
    i1 = Math.max(i1, LI);
    const t0 = mi(M[i0]), t1 = mi(M[i1]);
    let lo = Infinity, hi = -Infinity;
    opts.series.forEach(sr => sr.values.forEach((v,i)=>{ if (v!=null && i>=i0){ lo=Math.min(lo,v); hi=Math.max(hi,v);} }));
    if (opts.yMin!=null) lo = opts.yMin; else lo = Math.min(0, lo);
    if (opts.yMax!=null) hi = Math.max(opts.yMax, hi);
    // nice ticks
    const span = hi - lo || 1, raw = span/4, mag = Math.pow(10, Math.floor(Math.log10(raw)));
    const step = [1,2,2.5,5,10].map(x=>x*mag).find(x => span/x <= 5) || mag*10;
    if (opts.yMax==null) hi = Math.ceil(hi/step)*step;
    lo = Math.floor(lo/step)*step;
    const X = t => pad.l + (W-pad.l-pad.r) * (t - t0) / Math.max(1, (t1 - t0));
    const Y = v => pad.t + (H-pad.t-pad.b) * (1 - (v - lo)/((hi-lo)||1));
    const svg = s("svg",{viewBox:`0 0 ${W} ${H}`, width:"100%", role:"img", "aria-label": opts.aria || "Line chart"});
    const g = s("g",{class:"grid"}), ax = s("g",{class:"axis"});
    for (let v=lo; v<=hi+1e-9; v+=step){
      g.append(s("line",{x1:pad.l, x2:W-pad.r, y1:Y(v), y2:Y(v)}));
      const t = s("text",{x:pad.l-6, y:Y(v)+3.5, "text-anchor":"end"}); t.textContent = (opts.tickFmt||(x=>+x.toFixed(2)))(v); ax.append(t);
    }
    const y0 = +M[i0].slice(0,4), y1_ = +M[i1].slice(0,4);
    const every = (y1_-y0) > 6 ? 2 : 1;
    for (let y=y0+ (mi(M[i0])%12===0?0:1); y<=y1_; y+=every){
      const x = X(y*12); if (x < pad.l-1 || x > W-pad.r+1) continue;
      g.append(s("line",{x1:x,x2:x,y1:pad.t,y2:H-pad.b}));
      const t = s("text",{x:x, y:H-6, "text-anchor":"middle"}); t.textContent = y; ax.append(t);
    }
    svg.append(g, ax);
    (opts.markers||[]).forEach(mk => { const k = mi(mk.month); if (k<t0||k>t1) return;
      const x = X(k); svg.append(s("line",{x1:x,x2:x,y1:pad.t,y2:H-pad.b,stroke:"var(--ink-2)","stroke-width":1}));
    });
    opts.series.forEach(sr => {
      let d = "", prev = null;
      const singles = [];
      sr.values.forEach((v,i) => {
        if (i < i0 || v == null) return;
        const t = mi(M[i]);
        const gap = prev != null && (t - prev) > 3;
        d += (d === "" || gap ? "M" : "L") + X(t).toFixed(1) + "," + Y(v).toFixed(1);
        prev = t;
      });
      // isolated points (no neighbor within 3 months)
      const pts = sr.values.map((v,i)=> (i>=i0 && v!=null) ? mi(M[i]) : null);
      pts.forEach((t,i) => { if (t==null) return; const near = pts.some((u,j)=> j!==i && u!=null && Math.abs(u-t)<=3); if (!near) singles.push([t, sr.values[i]]); });
      if (d) svg.append(s("path",{d, fill:"none", stroke:sr.color, "stroke-width":sr.width||2, "stroke-linejoin":"round","stroke-linecap":"round"}));
      singles.forEach(([t,v]) => svg.append(s("circle",{cx:X(t), cy:Y(v), r:3.5, fill:sr.color, stroke:"var(--bg)", "stroke-width":2})));
      const [lv, li] = lastVal(sr.values);
      if (lv!=null && li>=i0 && sr.endDot!==false) svg.append(s("circle",{cx:X(mi(M[li])), cy:Y(lv), r:4, fill:sr.color, stroke:"var(--bg)","stroke-width":2}));
    });
    // hover layer
    const cross = s("line",{y1:pad.t, y2:H-pad.b, stroke:"var(--ink-2)", "stroke-width":1, opacity:0});
    const dots = opts.series.map(sr => { const c = s("circle",{r:4, fill:sr.color, stroke:"var(--bg)","stroke-width":2, opacity:0}); svg.append(c); return c; });
    svg.append(cross);
    const hit = s("rect",{x:pad.l, y:pad.t, width:W-pad.l-pad.r, height:H-pad.t-pad.b, fill:"transparent"});
    svg.append(hit);
    const tip = h("div",{class:"tip", hidden:true});
    const avail = []; for (let i=i0;i<=i1;i++) if (opts.series.some(sr=>sr.values[i]!=null)) avail.push(i);
    const move = ev => {
      const r = svg.getBoundingClientRect(); const sx = (ev.clientX - r.left) * W / r.width;
      const t = t0 + (sx - pad.l) / (W-pad.l-pad.r) * (t1-t0);
      let best = avail[0]; avail.forEach(i => { if (Math.abs(mi(M[i])-t) < Math.abs(mi(M[best])-t)) best = i; });
      const x = X(mi(M[best])); cross.setAttribute("x1",x); cross.setAttribute("x2",x); cross.setAttribute("opacity",1);
      tip.textContent = ""; tip.append(h("div",{class:"t",text:mlabel(M[best])}));
      opts.series.forEach((sr,k) => { const v = sr.values[best];
        if (v==null){ dots[k].setAttribute("opacity",0); return; }
        dots[k].setAttribute("cx",x); dots[k].setAttribute("cy",Y(v)); dots[k].setAttribute("opacity",1);
        tip.append(h("div",{class:"row"}, h("i",{class:"key",style:`background:${sr.color}`}), h("b",{text:fmt(v, opts.dp==null?2:opts.dp) + (opts.unit||"")}), h("span",{class:"small",text:sr.name})));
      });
      (opts.markers||[]).forEach(mk => { if (Math.abs(mi(mk.month)-mi(M[best]))<=1) tip.append(h("div",{class:"small",text:mk.label})); });
      tip.hidden = false;
      const bw = box.clientWidth, px = x * r.width / W;
      tip.style.left = Math.min(Math.max(0, px + 12), bw - tip.offsetWidth) + "px";
      tip.style.top = "8px";
      if (px + 12 + tip.offsetWidth > bw) tip.style.left = Math.max(0, px - tip.offsetWidth - 12) + "px";
    };
    const leave = () => { tip.hidden = true; cross.setAttribute("opacity",0); dots.forEach(d=>d.setAttribute("opacity",0)); };
    hit.addEventListener("pointermove", move); hit.addEventListener("pointerleave", leave);
    box.append(svg, tip);
  };
  requestAnimationFrame(draw);
  new ResizeObserver(() => draw()).observe(box);
  return wrap;
}

function barChart(opts){
  // opts: {cats:[], series:[{name,color,values}], stacked:true, height, fmtV}
  const box = h("div",{class:"chart"});
  const legend = h("div",{class:"legend"});
  if (opts.series.length>1) opts.series.forEach(sr => legend.append(h("span",null,h("i",{class:"bx",style:`background:${sr.color}`}), sr.name)));
  const wrap = h("div",null,legend,box);
  const fv = opts.fmtV || (v => Math.round(v).toLocaleString("en-US"));
  const draw = () => {
    box.textContent = "";
    const W = Math.max(260, box.clientWidth||500), H = opts.height||200, pad={l:44,r:8,t:12,b:24};
    const n = opts.cats.length; if (!n){ box.append(h("div",{class:"small",text:"None on record."})); return; }
    const tot = opts.cats.map((_,i)=> opts.series.reduce((a,sr)=>a+(sr.values[i]||0),0));
    let hi = Math.max(1, ...tot);
    const raw = hi/4, mag = Math.pow(10,Math.floor(Math.log10(raw))); const step = [1,2,2.5,5,10].map(x=>x*mag).find(x=>hi/x<=5);
    hi = Math.ceil(hi/step)*step;
    const bw = (W-pad.l-pad.r)/n, barW = Math.min(24, bw*0.6);
    const Y = v => pad.t + (H-pad.t-pad.b)*(1-v/hi);
    const svg = s("svg",{viewBox:`0 0 ${W} ${H}`,width:"100%",role:"img","aria-label":opts.aria||"Bar chart"});
    const g = s("g",{class:"grid"}), ax = s("g",{class:"axis"});
    for (let v=0; v<=hi+1e-9; v+=step){ g.append(s("line",{x1:pad.l,x2:W-pad.r,y1:Y(v),y2:Y(v)}));
      const t=s("text",{x:pad.l-6,y:Y(v)+3.5,"text-anchor":"end"}); t.textContent = (opts.tickFmt||(x=>x>=1000? (x/1000)+"K": x))(v); ax.append(t); }
    svg.append(g, ax);
    const tip = h("div",{class:"tip",hidden:true});
    opts.cats.forEach((c,i) => {
      const cx = pad.l + bw*i + bw/2;
      const t=s("text",{x:cx,y:H-6,"text-anchor":"middle"}); t.textContent = c; ax.append(t);
      let base = 0; const segs = [];
      opts.series.forEach((sr,k) => {
        const v = sr.values[i]||0; if (!v) return;
        const y0 = Y(base), y1 = Y(base+v); base += v;
        const top = k === opts.series.length-1 || opts.series.slice(k+1).every(o=>!(o.values[i]));
        const hgt = Math.max(0, y0-y1 - (base>v?2:0));
        const x = cx-barW/2, y = y1;
        const r = top ? Math.min(4, hgt/2) : 0;
        const p = top
          ? `M${x},${y+hgt}V${y+r}Q${x},${y} ${x+r},${y}H${x+barW-r}Q${x+barW},${y} ${x+barW},${y+r}V${y+hgt}Z`
          : `M${x},${y}H${x+barW}V${y+hgt}H${x}Z`;
        segs.push(s("path",{d:p, fill:sr.color}));
      });
      segs.forEach(p=>svg.append(p));
      const hit = s("rect",{x:pad.l+bw*i, y:pad.t, width:bw, height:H-pad.t-pad.b, fill:"transparent", tabindex:0});
      const show = () => { tip.textContent=""; tip.append(h("div",{class:"t",text:String(c)}));
        opts.series.forEach(sr => tip.append(h("div",{class:"row"},h("i",{class:"key",style:`background:${sr.color}`}),h("b",{text:fv(sr.values[i]||0)}),h("span",{class:"small",text:sr.name}))));
        if (opts.extra) tip.append(h("div",{class:"small",text:opts.extra(i)}));
        tip.hidden=false; const r = svg.getBoundingClientRect(); const px = cx*r.width/W;
        tip.style.left = Math.min(Math.max(0,px+10), box.clientWidth - tip.offsetWidth)+"px"; tip.style.top="4px";
        if (px+10+tip.offsetWidth > box.clientWidth) tip.style.left = Math.max(0, px - tip.offsetWidth - 10)+"px"; };
      hit.addEventListener("pointerenter", show); hit.addEventListener("focus", show);
      hit.addEventListener("pointerleave", ()=>tip.hidden=true); hit.addEventListener("blur", ()=>tip.hidden=true);
      svg.append(hit);
    });
    svg.append(s("line",{class:"base",x1:pad.l,x2:W-pad.r,y1:Y(0),y2:Y(0)}));
    box.append(svg, tip);
  };
  requestAnimationFrame(draw);
  new ResizeObserver(()=>draw()).observe(box);
  return wrap;
}

// ---------- search
const qEl = document.getElementById("q"), sugg = document.getElementById("sugg");
const searchIndex = FAC.map(f => ({f, text:(f.name+" "+(f.former_names||"")+" "+(f.city||"")+" "+((f.x||{}).owner_group||"")+" "+(f.cms_chain||"")+" "+(f.legal_business_name||"")).toLowerCase()}));
let suggIdx = -1, suggList = [];
function renderSugg(){
  const q = qEl.value.trim().toLowerCase();
  sugg.textContent = ""; suggIdx = -1;
  if (q.length < 2){ sugg.hidden = true; return; }
  const words = q.split(/\s+/);
  suggList = searchIndex.filter(x => words.every(w => x.text.includes(w))).slice(0,12).map(x=>x.f);
  if (!suggList.length){ sugg.append(h("div",{class:"small",style:"padding:8px 12px",text:"No homes match."})); sugg.hidden=false; return; }
  suggList.forEach((f,i) => sugg.append(h("button",{type:"button", onclick:()=>go(f)}, f.name, h("small",{text:[f.city, f.status!=="Open"?f.status:"", f.former_names? "Formerly: "+f.former_names.split("; ")[0]:""].filter(Boolean).join(" · ")}))));
  sugg.hidden = false;
}
function go(f){ sugg.hidden = true; qEl.value = ""; if (f.ccn) location.hash = "f-" + f.ccn; else { location.hash = "home"; } }
qEl.addEventListener("input", renderSugg);
qEl.addEventListener("keydown", e => {
  const btns = [...sugg.querySelectorAll("button")];
  if (e.key==="ArrowDown"){ suggIdx = Math.min(btns.length-1, suggIdx+1); e.preventDefault(); }
  else if (e.key==="ArrowUp"){ suggIdx = Math.max(0, suggIdx-1); e.preventDefault(); }
  else if (e.key==="Enter"){ if (suggList.length) go(suggList[Math.max(0,suggIdx)]); return; }
  else if (e.key==="Escape"){ sugg.hidden = true; return; } else return;
  btns.forEach((b,i)=>b.classList.toggle("on", i===suggIdx));
});
document.addEventListener("click", e => { if (!e.target.closest(".search")) sugg.hidden = true; });

      h("tbody",null, pens.map(p => h("tr",null, h("td",{class:"num",text:dlabel(p[0])}), h("td",null, p[1]==="Payment Denial" ? `Medicare/Medicaid payment denial${p[3]? " ("+p[3]+" days)":""}` : "Fine", p[5]===0 ? h("span",{class:"small",text:" · revised or withdrawn by CMS, not counted"}) : null), h("td",{class:"r num",style:p[5]===0?"text-decoration:line-through;color:var(--muted)":null,text:p[1]==="Fine"?money(p[2]):"–"})))))) : null));

  // ownership
  const own = D.owners[ccn] || [];
  const cur = own.filter(o=>o[7]), past = own.filter(o=>!o[7]);
  const roleGroup = r => /OWNERSHIP|PARTNERSHIP/i.test(r) ? "Owners (5% or more)" : /MANAGERIAL|MANAGING CONTROL|GOVERNING/i.test(r) ? "Operational or managerial control" : /SECURITY|MORTGAGE/i.test(r) ? "Lenders (mortgage or security interest)" : /ADP|TRUSTEE OF ANY/i.test(r) ? "Administrative/clinical service providers" : "Officers, directors, and managers";
  const ownBlock = (rows) => { const gs = {}; rows.forEach(o => { const g = roleGroup(o[0]); (gs[g] = gs[g] || []).push(o); });
    return ["Owners (5% or more)","Operational or managerial control","Officers, directors, and managers","Lenders (mortgage or security interest)","Administrative/clinical service providers"].filter(g=>gs[g]).map(g =>
      (() => {
        const people = [...new Map(gs[g].map(o=>[o[1],o])).values()];
        const li = o => h("li",null, o[1], h("span",{class:"small",text:[" ", o[2]==="Individual"?"":"(organization)", o[3] && !/NOT APPLICABLE|NO PERCENTAGE/.test(o[3]) ? o[3] : "", o[4] ? "since " + dlabel(o[4]) : "", !o[7] ? "last listed " + mlabel(o[6]) : ""].filter(Boolean).join(" ")}));
        const ul = h("ul",{style:"margin:4px 0 0;padding-left:18px"}, people.slice(0,8).map(li));
        const rest = people.slice(8);
        const btn = rest.length ? h("button",{class:"morebtn",type:"button",style:"margin-top:6px;padding:3px 10px;font-size:13px",text:`Show ${rest.length} more`,
          onclick:()=>{ rest.forEach(o=>ul.append(li(o))); btn.remove(); }}) : null;
        return h("div",{style:"margin-top:10px"}, h("div",{class:"eyebrow",text:g + " (" + people.length + ")"}), ul, btn);
      })());
  };
  const pastWrap = h("div",{hidden:true}, ownBlock(past));
  const tgl = h("button",{class:"morebtn",type:"button",text:`Show ${new Set(past.map(o=>o[1])).size} people and companies no longer listed`, onclick:()=>{ pastWrap.hidden = !pastWrap.hidden; tgl.textContent = pastWrap.hidden ? `Show ${new Set(past.map(o=>o[1])).size} people and companies no longer listed` : "Hide former owners and managers"; }});
  // name history
  const nm = (D.names[ccn]||[]).slice().sort((a,b)=> a[0]===b[0] ? (a[2]<b[2]?-1:1) : (a[0]<b[0]?-1:1));
  app.append(h("section",null, h("h2",{text:"Owners and operators"}),
    h("p",{class:"small",style:"margin:0 0 10px",text:"As reported to CMS. Ownership records since 2019; dates are when CMS says each party's role began."}),
    h("div",{class:"grid g2"},
      h("div",{class:"card"}, h("h3",{text:"Listed now"}), cur.length ? ownBlock(cur) : h("p",{class:"small",text:"No ownership records in the latest release."}), past.length ? [tgl, pastWrap] : null),
      h("div",{class:"card"}, h("h3",{text:"Name and operator history"}),
        h("div",{class:"timeline",style:"margin-top:10px"}, nm.map(r => h("div",{class:"tl-row"}, h("div",{class:"small num",text: mlabel(r[2]) + " – " + (r[3]===LATEST ? "now" : mlabel(r[3]))}),
          h("div",null, r[1], h("div",{class:"small",text: r[0]==="F" ? "Facility name" : "Legal business (operator) name"}))))),
        h("p",{class:"note",text:"A new operator name usually signals a change of ownership. Monthly records start in January 2019."})))));

  // quality measures
  const qms = D.qms[ccn] || {};
  const codes = Object.keys(D.qm_labels).filter(c=>qms[c] && qms[c].length);
  if (codes.length){
    const qa = (arr) => { const out = M.map(()=>null); return out; };
    const qchart = code => {
      // quarters -> plot at quarter end month
      const toM = q => { const y = q.slice(0,4), k = +q.slice(-1); return y + "-" + String(k*3).padStart(2,"0"); };
      const mk = (pairs) => { const v = M.map(()=>null); const extra = {}; pairs.forEach(([q,s])=>{ const m = toM(q); const i = M.indexOf(m); if (i>=0) v[i]=s; else extra[m]=s; }); return v; };
      return h("div",{class:"card"}, h("div",{class:"chart-title",style:"font-size:13px",text:D.qm_labels[code]}),
        lineChart({series:[{name:f.name,color:"var(--s1)",values:mk(qms[code])},{name:"RI average",color:"var(--s2)",values:mk(D.qm_ri[code]||[]),endDot:false}], dp: code.startsWith("55")?2:1, height:160, aria:D.qm_labels[code]}));
    };
    app.append(h("section",null, h("h2",{text:"Resident outcomes"}), h("p",{class:"small",style:"margin:0 0 10px",text:"Quarterly quality measures from resident assessments and Medicare claims. Lower is better for all of these."}),
      h("div",{class:"grid g3"}, codes.map(qchart))));
  }

  // ABC-RI extras
  const ex = [
    ["% of residents with dementia (2021, Brown LTCFocus)", x.pct_dementia_2021_ltcfocus, "%"],
    ["% of residents on Medicaid (2021, Brown LTCFocus)", x.pct_medicaid_2021_ltcfocus, "%"],
    ["% with schizophrenia or bipolar disorder (2021, Brown LTCFocus)", x.pct_smi_2021_ltcfocus, "%"],
    ["Special care unit beds (RIDOH, 2025)", x.scu_beds_ridoh_2025 || x.ridoh_alz_scu_beds, ""],
    ["Dementia care unit (RIHCA, 2025)", x.dementia_unit_rihca_2025 ? (x.dementia_unit_rihca_2025.toLowerCase().startsWith("y") ? "Yes" : x.dementia_unit_rihca_2025) : null, ""],
    ["Direct care spending per resident day (2022, EOHHS)", x.direct_care_per_diem_2022_eohhs ? "$"+(+x.direct_care_per_diem_2022_eohhs).toFixed(2) : null, ""],
    ["Union", x.union, ""],
    ["RIDOH licensed beds", x.ridoh_licensed_beds, ""],
    ["Notes", x.notes, ""],
  ].filter(r => r[1] != null && r[1] !== "" && r[1] !== "0");
  if (ex.length) app.append(h("section",null, h("h2",{text:"More about this home"}), h("p",{class:"small",style:"margin:0 0 10px",text:"Collected by ABC-RI from the sources named."}),
    h("div",{class:"card"}, h("dl",{class:"kv"}, ex.map(r => [h("dt",{text:r[0]}), h("dd",{class:"num",text: (isNaN(+r[1]) ? r[1] : (+r[1]).toLocaleString("en-US",{maximumFractionDigits:1})) + (r[2] && !isNaN(+r[1]) ? r[2] : "")})])))));
}

function footer(){
  app.append(h("footer",null,
    h("p",null, h("strong",{text:"About this page."}), " This page is published by Advocates for Better Care in Rhode Island (ABC-RI), an independent nonprofit advocacy organization. It is not produced, reviewed, or endorsed by CMS, the Rhode Island Department of Health (RIDOH), or any state agency, and it is not a substitute for their records."),
    h("p",{text:`Ratings, staffing, inspections, fines, and ownership come from the CMS Care Compare nursing home files, monthly releases January 2019 to ${D.meta.latest_label}. Owner groups, union, dementia, Medicaid, and spending figures are added by ABC-RI from the sources named on each home's page. The linked CMS inspection report is the official record; if anything here conflicts with it, the report governs. Updated ${D.meta.built}.`}),
    h("p",null, "Spotted an error? Email ", h("strong",{text:"corrections@abc-ri.org"}), ".")));

function route(){
  const hsh = (location.hash||"#home").slice(1);
  app.textContent = "";
  ["home","owners","about"].forEach(t => document.getElementById("tab-"+t).classList.toggle("on", hsh===t || (t==="home" && (hsh===""||hsh==="list"))));
  if (hsh.startsWith("f-")) viewFacility(hsh.slice(2));
  else if (hsh==="owners") viewOwners();
  else if (hsh==="about") viewAbout();
  else viewHome();
  footer();
  if (hsh !== "list") window.scrollTo(0,0);
  const f = hsh.startsWith("f-") && byCCN[hsh.slice(2)];
  document.title = f ? f.name + " · Rhode Island Nursing Homes" : "Rhode Island Nursing Homes";
}
window.addEventListener("hashchange", route);
route();
})();
